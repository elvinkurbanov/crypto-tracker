# Runs the tracker on GitHub's servers on a schedule and publishes the
# report to GitHub Pages at https://elvinkurbanov.github.io/crypto-tracker/
name: Update crypto report

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub often runs scheduled jobs late)
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tracker/requirements.txt

      - name: Install requirements
        run: pip install -r tracker/requirements.txt

      - name: Generate report
        working-directory: tracker
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}   # optional
        run: python crypto_tracker.py --quiet --no-open

      - name: Build site
        run: |
          mkdir -p _site
          # Reload the open page every 5 minutes so it picks up new runs
          sed 's#<head>#<head><meta http-equiv="refresh" content="300">#' \
            tracker/reports/latest.html > _site/index.html
          cp tracker/data/snapshot_latest.json _site/snapshot.json 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
